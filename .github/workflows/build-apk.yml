name: MR7 Talabaty - Full APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: mr7-talabaty-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android Gradle project not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project detected: $PROJECT_ROOT"
          find "$PROJECT_ROOT" -maxdepth 3 -type f | sort | head -n 200

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-cleanup: on-success

      - name: Verify build environment
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find extracted -type f -path '*/build/outputs/apk/*' \
            -name '*.apk' -exec cp {} apk-output/ \;

          if ! find apk-output -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::Build finished but no APK was found."
            exit 1
          fi

          echo "Generated APK files:"
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR7-Talabaty-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
